<!doctype html><meta charset="utf-8"><title>Legalio — Everything connected</title>
<style>
@font-face{font-family:Jakarta;src:url('jakarta-400.ttf');font-weight:400}
@font-face{font-family:Jakarta;src:url('jakarta-700.ttf');font-weight:700}
@font-face{font-family:Jakarta;src:url('jakarta-800.ttf');font-weight:800}
body{margin:0;background:#080f22}canvas{width:100vw;height:auto;display:block}
</style><canvas width="1920" height="1080"></canvas>
<script>
const c=document.querySelector('canvas'),g=c.getContext('2d');
const C={ink:'#101b36',blue:'#2b4eff',ice:'#b4d8ff',muted:'#697994',white:'#f8faff',line:'#dde5f1',lime:'#c0f36a',dark:'#080f22'};
const clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>1-Math.pow(1-clamp(x),3),pop=x=>{x=clamp(x);return 1+2.70158*Math.pow(x-1,3)+1.70158*Math.pow(x-1,2)};
function box(x,y,w,h,r=18,fill=C.white,stroke){g.beginPath();g.roundRect(x,y,w,h,r);g.fillStyle=fill;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=1.2;g.stroke()}}
function text(s,x,y,size=24,color=C.ink,weight=400,align='left'){g.font=`${weight} ${size}px Jakarta`;g.fillStyle=color;g.textAlign=align;g.textBaseline='alphabetic';g.fillText(s,x,y)}
function line(x,y,x2,y2,color=C.line,width=2){g.beginPath();g.moveTo(x,y);g.lineTo(x2,y2);g.strokeStyle=color;g.lineWidth=width;g.stroke()}
function circle(x,y,r,color){g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fillStyle=color;g.fill()}
function icon(x,y,type,color=C.blue,scale=1){g.save();g.translate(x,y);g.scale(scale,scale);g.strokeStyle=color;g.lineWidth=2;g.lineJoin='round';g.lineCap='round';g.beginPath();if(type==='doc'){g.moveTo(-9,-13);g.lineTo(3,-13);g.lineTo(10,-6);g.lineTo(10,13);g.lineTo(-9,13);g.closePath();g.moveTo(3,-13);g.lineTo(3,-6);g.lineTo(10,-6);g.moveTo(-4,0);g.lineTo(5,0);g.moveTo(-4,6);g.lineTo(5,6)}else if(type==='folder'){g.moveTo(-13,-6);g.lineTo(-13,-10);g.lineTo(-4,-10);g.lineTo(0,-6);g.lineTo(13,-6);g.lineTo(11,11);g.lineTo(-13,11);g.closePath()}else if(type==='spark'){g.moveTo(0,-15);g.quadraticCurveTo(2,-2,14,0);g.quadraticCurveTo(2,2,0,15);g.quadraticCurveTo(-2,2,-14,0);g.quadraticCurveTo(-2,-2,0,-15)}else if(type==='check'){g.moveTo(-8,0);g.lineTo(-2,6);g.lineTo(10,-7)}else{g.roundRect(-12,-10,24,23,4);g.moveTo(-12,-3);g.lineTo(12,-3);g.moveTo(-6,-14);g.lineTo(-6,-7);g.moveTo(6,-14);g.lineTo(6,-7)}g.stroke();g.restore()}
const logos={};for(const [key,file] of [['dark','logo-full.png'],['light','logo-light.png']]){logos[key]=new Image();logos[key].src='../../../packages/platform-console/src/assets/'+file;}
function logo(x,y,s=1,color=C.ink){g.drawImage(logos[color===C.white?'light':'dark'],x,y,240*s,49*s)}
function tag(s,x,y,w,fill=C.lime,color=C.ink){box(x,y,w,30,15,fill);text(s,x+w/2,y+20,12,color,700,'center')}
function appear(t,start,fn,d=.55){const p=ease((t-start)/d);if(p<=0)return;g.save();g.globalAlpha*=p;g.translate(0,(1-p)*28);fn(p);g.restore()}
function backdrop(t,dark=false){g.fillStyle=dark?C.dark:'#f1f5fc';g.fillRect(0,0,1280,720);g.save();g.globalAlpha=.45;const grad=g.createRadialGradient(970+40*Math.sin(t),200,0,950,200,680);grad.addColorStop(0,dark?'#153877':'#d9e6ff');grad.addColorStop(1,dark?C.dark:'#f1f5fc');g.fillStyle=grad;g.fillRect(0,0,1280,720);g.restore();g.save();g.globalAlpha=dark?.14:.4;for(let x=40;x<1280;x+=40)for(let y=40;y<720;y+=40)circle(x,y,.7,dark?C.ice:'#a0b2cd');g.restore()}
function chrome(n,dark=false){logo(55,38,.59,dark?C.white:C.ink);text('PARTNERS  /  CONTRACTS  /  SPENDING',1225,65,11,dark?'#a0b2d0':C.muted,700,'right');line(55,660,1225,660,dark?'#27324c':C.line);text('ONE CONNECTED WORKSPACE',55,686,10,dark?'#8395b5':C.muted,700);text('LEGALIO  /  '+n,1225,686,10,dark?'#8395b5':C.muted,700,'right')}
function opening(t){backdrop(t,true);chrome('01',true);appear(t,0,()=>{text('LESS SCATTER.',640,276,70,C.white,800,'center')});appear(t,.35,()=>text('More clarity.',640,363,88,C.ice,800,'center'));appear(t,.65,()=>text('Your partners, contracts and spending. Connected.',640,422,21,'#a7b9d6',400,'center'));
const labels=['PARTNERS','CONTRACTS','INSERTION ORDERS'];const types=['folder','doc','doc'];for(let i=0;i<3;i++){const p=pop((t-.75-i*.12)/.7),x=420+i*220;g.save();g.translate(x,530);g.rotate((1-clamp((t-.75-i*.12)/.7))*(i-1)*.3);g.scale(Math.max(.01,p),Math.max(.01,p));box(-95,-31,190,62,16,'#16233e','#344563');icon(-65,0,types[i],C.ice,.7);text(labels[i],-40,5,11,C.white,700);g.restore()}const flow=clamp((t-1.55)/.55);line(515,530,515+30*flow,530,C.blue,3);line(735,530,735+30*flow,530,C.blue,3)}
function hierarchy(t){backdrop(t);chrome('02');appear(t,0,()=>{text('EVERY RELATIONSHIP.',65,208,14,C.blue,700);text('One clear',65,285,57,C.ink,800);text('picture.',65,355,57,C.blue,800);text('From partner to contract',65,413,20,C.muted);text('to insertion order.',65,444,20,C.muted)});
appear(t,.1,()=>{box(570,143,645,452,27,'#fff',C.line);text('YOUR WORKSPACE',602,184,11,C.muted,700);tag('Connected',1070,162,112);line(602,204,1183,204)});
const rows=[['Partner','Cloud services',620,231,524],['Contract','Master service agreement',658,340,486],['Insertion order','Colocation services',696,449,448]];rows.forEach(([title,sub,x,y,w],i)=>appear(t,.3+i*.42,()=>{if(i){line(x-21,y-43,x-21,y+34,'#9aafff',2);line(x-21,y+34,x-2,y+34,'#9aafff',2)}box(x,y,w,86,15,i===2?'#eef2ff':'#f7f9fd',i===2?'#94a6ff':C.line);box(x+16,y+18,48,48,12,i===2?C.blue:'#e8efff');icon(x+40,y+42,i?'doc':'folder',i===2?'white':C.blue);text(title,x+80,y+34,20,C.ink,700);text(sub,x+80,y+60,13,C.muted);circle(x+w-26,y+42,5,C.blue)}));
}
function ai(t){backdrop(t,true);chrome('03',true);appear(t,0,()=>{text('READ LESS.',65,219,14,C.ice,700);text('Understand',65,295,54,C.white,800);text('more.',65,365,65,C.ice,800);text('AI assistance for the details',65,422,19,'#a7b9d6');text('that deserve your attention.',65,453,19,'#a7b9d6')});
appear(t,.1,()=>{box(593,150,430,433,22,'#f8faff');icon(632,191,'doc');text('Service agreement',661,198,19,C.ink,700);line(622,223,994,223);for(let i=0;i<7;i++){box(625,248+i*34,i%3===0?280:345,9,4,'#dae2ef')}const scan=ease(t/2);g.save();g.globalAlpha=.16;box(615,240+scan*210,389,50,4,C.blue);g.restore();line(617,240+scan*210,1002,240+scan*210,C.blue,2)});
appear(t,.6,()=>{box(800,320,410,207,20,C.blue);icon(833,354,'spark','white',.75);text('AI document assistant',857,361,16,C.white,700);line(824,379,1186,379,'#6380ff');text('Find the key terms.',824,412,23,C.white,700);appear(t,1.05,()=>{tag('Renewal terms',824,438,145,'#4b68ff','white');tag('Notice periods',981,438,154,'#4b68ff','white')});appear(t,1.4,()=>text('Ask questions. Explore your documents.',824,496,13,'#d5e1ff'))});
}
function overview(t){backdrop(t);chrome('04');appear(t,0,()=>{text('STAY A STEP AHEAD.',640,161,13,C.blue,700,'center');text('See spend. Track what’s next.',640,225,44,C.ink,800,'center')});
appear(t,.16,()=>{box(90,272,640,326,23,'white',C.line);text('Spending overview',119,313,19,C.ink,700);tag('One place',575,291,125,'#edf2ff',C.blue);text('A clearer view of every invoice.',119,345,14,C.muted);const bars=[.42,.64,.53,.8,.72,1];for(let i=0;i<6;i++){const h=149*bars[i]*ease((t-.32-i*.1)/.75);box(126+i*94,548-h,57,h,8,i===5?C.blue:'#b6c6ff');text(['JAN','FEB','MAR','APR','MAY','JUN'][i],155+i*94,574,10,C.muted,700,'center')}line(118,548,697,548,C.line)});
appear(t,.55,()=>{box(753,272,437,326,23,C.ink);icon(792,312,'calendar',C.ice);text('Keep key dates in sight.',824,319,20,C.white,700);text('Renewals. Notices. Deadlines.',784,354,14,'#a7b9d6');for(let i=0;i<3;i++)appear(t,.8+i*.23,()=>{const y=380+i*62;box(780,y,383,50,11,'#202f4e');circle(801,y+25,4,i===0?C.lime:C.ice);text(['Contract renewal','Notice period','Insertion order end'][i],817,y+31,14,C.white);text(['UP NEXT','TRACKED','TRACKED'][i],1146,y+30,9,i===0?C.lime:C.ice,700,'right')})});
}
function closing(t){backdrop(t,true);const p=ease(t/.9);g.save();g.translate(640,335);g.rotate(-.12+ .12*p);for(let i=0;i<3;i++){g.strokeStyle=['#243d76','#1c2c53','#162340'][i];g.lineWidth=1;g.beginPath();g.ellipse(0,0,325+i*95,210+i*58,.1,0,2*Math.PI);g.stroke()}for(let i=0;i<8;i++){const a=i*Math.PI/4+t*.18;circle(Math.cos(a)*515,Math.sin(a)*302,i%2?3:5,i%2?'#27457d':C.ice)}g.restore();appear(t,.12,()=>logo(446,224,1.6,C.white));appear(t,.45,()=>text('Everything connected.',640,391,44,C.white,800,'center'));appear(t,.75,()=>text('Partners. Contracts. Spending.',640,438,21,'#a7b9d6',400,'center'));appear(t,1,()=>{box(497,484,286,57,28,C.lime);text('Explore Legalio  ↗',640,521,20,C.ink,700,'center')});appear(t,1.2,()=>text('legalio.web.id',640,583,17,C.ice,700,'center'));}
const scenes=[opening,hierarchy,ai,overview,closing];
window.render=async function(time){g.setTransform(1.5,0,0,1.5,0,0);g.globalAlpha=1;let idx=Math.min(4,Math.floor(time/3)),local=time-idx*3;scenes[idx](local);if(idx>0&&local<.32){const p=ease(local/.32);g.save();g.translate(-1280*p,0);scenes[idx-1](3+local);g.restore();g.fillStyle=C.blue;g.fillRect(1280*(1-p)-8,0,8,720)}g.fillStyle=C.blue;g.fillRect(0,716,1280*time/15,4);};
window.ready=Promise.all([...Object.values(logos).map(im=>im.decode()),...[400,700,800].map(w=>document.fonts.load(`${w} 30px Jakarta`))]);
window.ready.then(()=>window.render(13.9));
</script>
