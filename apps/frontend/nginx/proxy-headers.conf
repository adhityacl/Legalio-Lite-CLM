# Preserve the public port (for example :8080) for auth origin checks.
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Proto $scheme;
# The peer address nginx actually saw, never a client-supplied chain: the backend uses it for rate limiting and audit logs.
# (Behind another proxy/CDN this is that proxy's address; see docs/RUNBOOK.md "Behind a CDN or load balancer".)
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
