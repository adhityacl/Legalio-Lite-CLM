# Included at server level and in every location that sets its own add_header
# (nginx drops inherited add_header directives as soon as a location defines one).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Report-Only on purpose: observe violations in the browser console first, then rename to Content-Security-Policy to enforce.
# Allows what the app uses today: Google Fonts, inline styles
# (React style props, Tiptap), data:/blob: images and previews, and sandboxed srcdoc/blob iframes.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: data:; connect-src 'self'; frame-src 'self' blob: data: about:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
# HSTS is only sent when the request reached nginx over TLS (here, or via an upstream TLS proxy that sets X-Forwarded-Proto: https).
add_header Strict-Transport-Security $hsts always;
