services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file: apps/backend/.env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - legalio-data:/data
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  legalio-data:
