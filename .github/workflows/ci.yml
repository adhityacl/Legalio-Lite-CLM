name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.changed.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            apps=$(git diff --name-only "$BASE" HEAD | node scripts/affected-apps.mjs)
          else
            apps='["frontend","backend"]'
          fi
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  verify:
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx turbo run lint --filter=@legalio/${{ matrix.app }} --concurrency=1
      - run: npm run test:${{ matrix.app }}
      - if: matrix.app == 'backend'
        run: npm run test:tenant-boundaries
      - run: npx turbo run build --filter=@legalio/${{ matrix.app }}
