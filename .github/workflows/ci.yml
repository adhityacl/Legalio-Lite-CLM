name: CI

on:
  pull_request:
  push:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: legalio
          POSTGRES_PASSWORD: legalio
          POSTGRES_DB: legalio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U legalio -d legalio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Tests create and drop throwaway legalio_test_* databases on this server (see apps/backend/src/testDatabase.ts).
      TEST_DATABASE_URL: postgres://legalio:legalio@127.0.0.1:5432/legalio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
