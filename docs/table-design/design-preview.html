<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Application table design</title>
<style>
/* Shared table design, based on the approved Partners table reference.
   Opt-in classes keep authored document tables outside the application UI.
   The page/dialog scope preserves the explicitly excluded pages. */
:root {
  --table-surface: #ffffff;
  --table-header: #f7f9fb;
  --table-border: #dfe5ee;
  --table-text: #111827;
  --table-text-secondary: #405777;
  --table-icon: #91a4bf;
  --table-hover: #f8fafc;
  --table-selected: #ecfdf5;
  --table-radius: 20px;
  --table-font-size: 14px;
  --table-row-height: 58px;
  --table-cell-padding: 16px;
  --table-shadow: 0 1px 3px rgb(15 23 42 / 10%);
}

.dark {
  --table-surface: #0f172a;
  --table-header: #182235;
  --table-border: #334155;
  --table-text: #f1f5f9;
  --table-text-secondary: #cbd5e1;
  --table-icon: #94a3b8;
  --table-hover: #1e293b;
  --table-selected: #12332b;
  --table-shadow: 0 1px 3px rgb(0 0 0 / 20%);
}

[data-table-design="standard"] .ds-table-surface {
  min-width: 0;
  border: 1px solid var(--table-border);
  border-radius: var(--table-radius);
  background: var(--table-surface);
  box-shadow: var(--table-shadow);
  overflow: hidden;
}

/* A scrollable primitive inside an existing table card shares its border. */
[data-table-design="standard"] .ds-table-surface .ds-table-surface {
  border: 0;
  border-radius: 0;
  box-shadow: none;
}

[data-table-design="standard"] .ds-table-surface:has(> table),
[data-table-design="standard"] .ds-table-surface > .overflow-x-auto {
  overflow-x: auto;
}

[data-table-design="standard"] .ds-table {
  width: 100%;
  border-collapse: collapse;
  background: var(--table-surface);
  color: var(--table-text-secondary);
  font-size: var(--table-font-size);
  line-height: 1.5;
}

[data-table-design="standard"] .ds-table > thead,
[data-table-design="standard"] .ds-table > thead > tr {
  background: var(--table-header);
  color: var(--table-text-secondary);
  border-bottom: 1px solid var(--table-border);
  text-transform: none;
  letter-spacing: normal;
}

[data-table-design="standard"] .ds-table > :is(thead, tbody, tfoot) > tr > :is(th, td) {
  height: var(--table-row-height);
  padding: 14px var(--table-cell-padding);
  border-color: var(--table-border);
  font-size: var(--table-font-size);
  vertical-align: middle;
}

[data-table-design="standard"] .ds-table > thead > tr > th {
  color: var(--table-text-secondary);
  font-weight: 600;
  text-transform: none;
  letter-spacing: normal;
  white-space: nowrap;
}

[data-table-design="standard"] .ds-table > :is(thead, tbody, tfoot) > tr > :is(th, td):first-child {
  padding-left: 28px;
}

[data-table-design="standard"] .ds-table > :is(thead, tbody, tfoot) > tr > :is(th, td):last-child {
  padding-right: 28px;
}

[data-table-design="standard"] .ds-table > tbody > tr {
  border-bottom: 1px solid var(--table-border);
  background: var(--table-surface);
  transition: background-color 150ms;
}

[data-table-design="standard"] .ds-table > tbody > tr:last-child {
  border-bottom: 0;
}

[data-table-design="standard"] .ds-table > tbody > tr:hover {
  background: var(--table-hover);
}

[data-table-design="standard"] .ds-table > tbody > tr:has(input[type="checkbox"]:checked) {
  background: var(--table-selected);
}

[data-table-design="standard"] .ds-table > tbody > tr > td {
  color: var(--table-text-secondary);
}

[data-table-design="standard"] .ds-table > tbody > tr > td:is(.font-medium, .font-semibold, .font-bold).text-slate-900 {
  color: var(--table-text);
}

[data-table-design="standard"] .ds-table td :is(.font-medium, .font-semibold, .font-bold):is(.text-slate-900, .text-ink),
[data-table-design="standard"] .ds-table td.font-medium {
  color: var(--table-text);
}

[data-table-design="standard"] .ds-table > thead > tr > th { background: var(--table-header); }

[data-table-design="standard"] .ds-table th button {
  font-size: inherit;
  font-weight: inherit;
}

[data-table-design="standard"] .ds-table th button svg {
  color: var(--table-icon);
}

[data-table-design="standard"] .ds-table input[type="checkbox"] {
  width: 16px;
  height: 16px;
  min-height: 0;
  accent-color: var(--line-brand-green-strong);
}

[data-table-design="standard"] .ds-table :is(.rounded-full.border, [data-slot="badge"]) {
  border-radius: 999px;
  padding: 3px 14px;
  font-size: 13px;
  line-height: 1.5;
  font-weight: 400;
  box-shadow: none;
}

[data-table-design="standard"] .ds-table-pagination {
  border-color: var(--table-border);
  background: var(--table-surface);
  padding: 16px 28px;
  color: var(--table-text-secondary);
}

[data-table-design="standard"] .ds-table-pagination :is(span, select) {
  font-size: var(--table-font-size);
  font-weight: 400;
  color: var(--table-text-secondary);
}

[data-table-design="standard"] .ds-table-pagination :is(button, select) {
  border-color: var(--table-border);
  border-radius: 14px;
  background-color: var(--table-surface);
  box-shadow: none;
}

[data-table-design="standard"] .ds-table-pagination button:disabled {
  color: var(--table-icon);
  opacity: .35;
}

@media (max-width: 639px) {
  [data-table-design="standard"] .ds-table-pagination { padding: 16px; }
  [data-table-design="standard"] .ds-table > :is(thead, tbody, tfoot) > tr > :is(th, td):first-child { padding-left: 16px; }
  [data-table-design="standard"] .ds-table > :is(thead, tbody, tfoot) > tr > :is(th, td):last-child { padding-right: 16px; }
  [data-table-design="standard"] .ds-table input[type="checkbox"] { width: 20px; height: 20px; }
}

@media (prefers-reduced-motion: reduce) {
  [data-table-design="standard"] .ds-table > tbody > tr { transition: none; }
}

/* The legacy dark theme uses important base-layer overrides. These narrowly
   scoped rules let opted-in tables use their own semantic tokens. */
@layer base {
  .dark [data-table-design="standard"] :is(.ds-table-surface, .ds-table, .ds-table-pagination) {
    background-color: var(--table-surface) !important;
    border-color: var(--table-border) !important;
  }
  .dark [data-table-design="standard"] .ds-table > thead,
  .dark [data-table-design="standard"] .ds-table > thead > tr,
  .dark [data-table-design="standard"] .ds-table > thead > tr > th {
    background-color: var(--table-header) !important;
    color: var(--table-text-secondary) !important;
    border-color: var(--table-border) !important;
  }
  .dark [data-table-design="standard"] .ds-table > tbody > tr {
    background-color: var(--table-surface) !important;
    border-color: var(--table-border) !important;
  }
  .dark [data-table-design="standard"] .ds-table > tbody > tr:hover {
    background-color: var(--table-hover) !important;
  }
  .dark [data-table-design="standard"] .ds-table > tbody > tr:has(input[type="checkbox"]:checked) {
    background-color: var(--table-selected) !important;
  }
  .dark [data-table-design="standard"] .ds-table > tbody > tr > td {
    border-color: var(--table-border) !important;
    color: var(--table-text-secondary) !important;
  }
  .dark [data-table-design="standard"] .ds-table > tbody > tr > td:is(.font-medium, .font-semibold, .font-bold).text-slate-900 {
    color: var(--table-text) !important;
  }
  .dark [data-table-design="standard"] .ds-table-pagination :is(button, select) {
    border-color: var(--table-border) !important;
    background-color: var(--table-surface) !important;
    color: var(--table-text-secondary) !important;
  }
}

*{box-sizing:border-box}body{margin:0;padding:24px;font-family:system-ui,sans-serif;background:#f3f4f0;color:var(--table-text)}.dark body{background:#0b0f19}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}h1{font-size:20px}button,select{font:inherit;color:inherit;border:1px solid var(--table-border);padding:12px;background:var(--table-surface);cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #04803d;outline-offset:2px}.scroll{overflow-x:auto}.ds-table{min-width:760px;text-align:left}.ds-table-pagination{display:flex;justify-content:space-between;align-items:center;gap:20px}.navigation{display:flex;gap:8px;align-items:center}.rounded-full.border{display:inline-flex;border:1px solid #6ee7b7;background:#ecfdf5;color:#047857}.rounded-full.border.warning{border-color:#fdba74;background:#fff7ed;color:#b45309}.dark .rounded-full.border{background:#12332b;color:#a7f3d0}.dark .rounded-full.border.warning{background:#382811;color:#fcd34d}@media(max-width:640px){body{padding:12px}.ds-table-pagination{flex-wrap:wrap}.navigation{flex-wrap:wrap}} 
</style></head><body data-table-design="standard">
<header><h1>Application table design</h1><button id="theme" type="button">Switch theme</button></header>
<div class="ds-table-surface"><div class="scroll">
<table class="ds-table"><thead><tr><th><input id="all" aria-label="Select all rows" type="checkbox"></th><th>Partner Name</th><th>Country</th><th>PIC &amp; Contact</th><th>Partner Status</th><th>Audit Status DD</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="ds-table-pagination"><label><select id="size" aria-label="Rows per page"><option>2</option><option selected>5</option><option>10</option></select> Rows per page</label><div class="navigation"><span id="page" aria-live="polite"></span><button id="first" aria-label="First page">«</button><button id="prev" aria-label="Previous page">‹</button><button id="next" aria-label="Next page">›</button><button id="last" aria-label="Last page">»</button></div></div></div>
<script>
const names=["Telkomsagma Infrastruktur Digital","Pefin Biro Kredit Indonesia","Vidia Visi Verifikasi Digital","AntaVoya Mitra Wisata","GroupN Media Indonesia","Nusantara Digital","Citra Media","Mitra Infrastruktur"];
let page=1; const selected=new Set(); const size=document.getElementById("size");
function render(){const count=Number(size.value),total=Math.ceil(names.length/count);page=Math.min(page,total);document.getElementById("rows").innerHTML=names.slice((page-1)*count,page*count).map((name,index)=>{const id=(page-1)*count+index;return '<tr><td><input type="checkbox" aria-label="Select '+name+'" data-id="'+id+'" '+(selected.has(id)?'checked':'')+'></td><td style="color:var(--table-text)">PT '+name+'</td><td><span class="rounded-full border">ID</span></td><td>Partner contact</td><td><span class="rounded-full border">Active</span></td><td><span class="rounded-full border warning">◷ Incomplete</span></td><td><button aria-label="Actions for '+name+'" style="border:0;padding:4px">···</button></td></tr>';}).join("");document.getElementById("page").textContent="Page "+page+" of "+total;document.getElementById("first").disabled=document.getElementById("prev").disabled=page===1;document.getElementById("next").disabled=document.getElementById("last").disabled=page===total;document.getElementById("all").checked=names.slice((page-1)*count,page*count).every((_,index)=>selected.has((page-1)*count+index));}
document.getElementById("theme").onclick=()=>document.documentElement.classList.toggle("dark");
size.onchange=()=>{page=1;render()};document.getElementById("first").onclick=()=>{page=1;render()};document.getElementById("prev").onclick=()=>{page--;render()};document.getElementById("next").onclick=()=>{page++;render()};document.getElementById("last").onclick=()=>{page=Math.ceil(names.length/Number(size.value));render()};
document.getElementById("rows").onchange=event=>{const id=Number(event.target.dataset.id);event.target.checked?selected.add(id):selected.delete(id);render()};
document.getElementById("all").onchange=event=>{const count=Number(size.value);names.slice((page-1)*count,page*count).forEach((_,index)=>{const id=(page-1)*count+index;event.target.checked?selected.add(id):selected.delete(id)});render()};render();
</script></body></html>
